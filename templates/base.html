{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/normalize.css' %}?v={{ ts }}">
    <link rel="stylesheet" href="{% static 'css/skeleton.css' %}?v={{ ts }}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ ts }}">
    <title>
        {% block title %}
        ClassCompass
        {% endblock %}
    </title>
</head>


<body class="{% block body_class %}{% endblock %}">

<header>
    <h1>ClassCompass</h1>

    <nav>
        {% if user.is_authenticated %}

        <a href="{% url 'courses:dashboard' %}">
            Home
        </a>

        <a href="{% url 'courses:study_tool_list' %}">
            Study Tools
        </a>

        <a href="{% url 'courses:course_list' %}">
            Courses
        </a>

        <a href="{% url 'courses:calendar' %}">
            Calendar
        </a>

        <a href="{% url 'courses:event_search' %}">
            Search Events
        </a>

        <a href="{% url 'courses:course_search' %}">
            Search Courses
        </a>

        <a href="{% url 'courses:reports' %}">
            Reports
        </a>

        <form
                method="POST"
                action="{% url 'logout' %}"
                style="display: inline;"
        >
            {% csrf_token %}

            <button type="submit">
                Logout ({{ user.username }})
            </button>
        </form>

        {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <a href="{% url 'signup' %}">
            Sign Up
        </a>

        {% endif %}
    </nav>

    <hr>
</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>
    <hr>
    <p>ClassCompass</p>
</footer>

</body>

</html>
