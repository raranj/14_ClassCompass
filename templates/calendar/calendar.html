{% extends "base.html" %}

{% block title %}Calendar | ClassCompass{% endblock %}

{% block content %}
    <h2>Calendar</h2>

    <ul>
        {% for event in events %}
            <li>{{ event.title }} — {{ event.scheduled_at }}</li>
        {% empty %}
            <li>No events scheduled yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
