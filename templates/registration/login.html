{% extends "base.html" %}

{% block title %}
Login - ClassCompass
{% endblock %}

{% block content %}

<h2>Login</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.non_field_errors }}

    <div>
        <label for="{{ form.username.id_for_label }}">
            Username
        </label>
        {{ form.username }}
        {{ form.username.errors }}
    </div>

    <div>
        <label for="{{ form.password.id_for_label }}">
            Password
        </label>
        {{ form.password }}
        {{ form.password.errors }}
    </div>

    <input
        type="hidden"
        name="next"
        value="{{ next }}"
    >

    <button type="submit">
        Login
    </button>
</form>

<p>
    Don't have an account?
    <a href="{% url 'signup' %}">Sign Up</a>
</p>

{% endblock %}
